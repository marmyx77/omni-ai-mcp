name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Read-only token: tests never need to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      # Integration tests are hermetic (no API key needed): a failure here is
      # a real failure. Never add continue-on-error back — it hid 34 red tests
      # behind a green badge until 2026-09-19.
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

      - name: Check imports
        run: |
          python -c "from app.core.config import config; print(f'v{config.version}: model_pro={config.model_pro}')"
          python -c "from app.services.model_registry import model_registry; print('ModelRegistry OK')"
          python -c "from app.services.openrouter import openrouter_client; print('OpenRouterClient OK')"

  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Makes origin/main resolvable for git-ref checks (checkout is shallow).
      - name: Fetch main for virgilio
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: virgilio — reality gate (BLOCKING)
        run: node virgilio/bin/cli.mjs check --config virgilio.config.json

      # Prove-it-bites: CI itself verifies the gate isn't blind.
      - name: virgilio — bite (prove-it-bites)
        run: node virgilio/bin/cli.mjs bite
