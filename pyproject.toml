[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-ai-mcp"
version = "4.8.2"
description = "MCP server bridging Claude with Google Gemini (video, music, voice, images, Deep Research, agents, 1M context) and 400+ OpenRouter models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Marco Armellino"}
]
keywords = ["mcp", "model-context-protocol", "gemini", "google-genai", "claude", "claude-code", "openrouter",
            "multimodal", "video-generation", "text-to-speech", "music-generation", "deep-research", "rag", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2",  # 2.x (2026-09) removed mcp.server.fastmcp; migration tracked in the roadmap
    "google-genai>=2.33.0",  # Voices API (>=2.25), Interactions request schema with video/speech/agent configs
    "pydantic>=2.0.0",
    "defusedxml>=0.7.1",
    "filelock>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/marmyx77/omni-ai-mcp"
Repository = "https://github.com/marmyx77/omni-ai-mcp"
Issues = "https://github.com/marmyx77/omni-ai-mcp/issues"
Changelog = "https://github.com/marmyx77/omni-ai-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/marmyx77/omni-ai-mcp#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
omni-ai-mcp = "app.server:main"
omni-ai-mcp-setup = "app.cli:setup_claude"

[project.entry-points."omni_ai_mcp.plugins"]
# Example plugin entry point (for third-party plugins)
# my_plugin = "my_package.plugins:register"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
