# docker-compose.yml for omni-ai-mcp
#
# omni-ai-mcp is a stdio MCP server: the MCP client (Claude Code, Claude Desktop)
# starts one container per session and talks to it over stdin/stdout. Compose is
# used here to BUILD the image and to run it interactively for a quick check:
#
#   docker compose build
#   docker compose run --rm omni-ai-mcp          # then type a JSON-RPC message, Ctrl-D to exit
#
# To use it from Claude Code, register the container command (see README → Docker):
#   claude mcp add omni-ai-mcp --scope user -- docker run -i --rm -e GEMINI_API_KEY=... \
#     -v "$HOME/omni-workspace:/workspace" -v omni-ai-mcp-logs:/logs omni-ai-mcp

services:
  omni-ai-mcp:
    build: .
    image: omni-ai-mcp
    stdin_open: true          # MCP over stdio
    tty: false
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:?set GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_SANDBOX_ROOT=/workspace
      - GEMINI_LOG_DIR=/logs
    volumes:
      - ./workspace:/workspace:rw     # files the tools may read and write (sandbox)
      - omni-ai-mcp-logs:/logs:rw      # logs + SQLite conversation memory
    # Security constraints
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512M                 # generated media default to /tmp
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

volumes:
  omni-ai-mcp-logs:
